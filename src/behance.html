<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>FIBRA — Behance</title>
<link rel="stylesheet" href="base.css">
<style>
  .capa { width: 808px; height: 632px; }
  .shot { width: 1600px; height: 1200px; }
</style></head>
<body>
<!-- capa do projeto (808 × 632; exportada a 2×) -->
<section class="prancha capa bg-fuba" data-nome="behance-capa">
  <fibra-logo class="abs" cor="feijao" style="left:44px;top:44px;width:330px"></fibra-logo>
  <p class="abs t-titulo" style="left:44px;top:220px;width:300px;font-size:30px">Comida de verdade é direito de todo mundo.</p>
  <p class="abs t-rotulo" style="left:44px;bottom:44px;font-size:12px;text-box:trim-both cap alphabetic">Identidade visual · Brasil</p>
  <fibra-anel cor="couve" traco="15" style="left:350px;top:170px;width:440px"></fibra-anel>
  <fibra-pessoa nome="agro-chapeu" style="left:440px;bottom:0;width:300px"></fibra-pessoa>
</section>

<!-- shots para Dribbble / redes de portfólio (1600 × 1200) -->
<section class="prancha shot bg-feijao" data-nome="shot-1-dado">
  <div class="abs t-bloco c-fuba" data-bloco style="left:110px;width:1380px;top:150px"><span class="ln">24,2%</span></div>
  <p class="abs t-titulo c-arroz" style="left:110px;top:600px;width:1000px;font-size:58px">dos lares brasileiros conviveram com algum grau de insegurança alimentar em 2024.</p>
  <fibra-isotipo class="abs" valor="24.2" total="100" cols="20" cor="fuba" base="arroz" opac=".22" style="left:110px;top:880px;width:1380px"></fibra-isotipo>
</section>
<section class="prancha shot bg-couve" data-nome="shot-2-retrato">
  <fibra-anel cor="fuba" traco="15" style="left:640px;top:250px;width:1000px"></fibra-anel>
  <fibra-pessoa nome="agro-jovem" style="left:620px;bottom:0;width:980px"></fibra-pessoa>
  <p class="abs t-display c-arroz" style="left:110px;top:150px;width:560px;font-size:120px">Do campo pra sua mesa.</p>
  <fibra-logo class="abs" cor="arroz" style="left:110px;bottom:110px;width:240px"></fibra-logo>
</section>
<section class="prancha shot bg-fuba papel" data-nome="shot-3-bloco">
  <div class="abs t-bloco" data-bloco style="left:110px;width:1380px;top:120px;gap:24px"><span class="ln">Comida de verdade</span><span class="ln">é direito de</span><span class="ln">todo mundo.</span></div>
  <fibra-logo class="abs" cor="feijao" style="left:110px;bottom:110px;width:260px"></fibra-logo>
</section>
<script src="letras.js"></script><script src="fotos.js"></script><script src="rostos.js"></script><script src="pessoas.js"></script><script src="fibra.js"></script>
</body></html>
